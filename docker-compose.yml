version: '3.8'

services:
  px4-gps-spoofing:
    build: ./docker
    container_name: px4-gps-spoofing
    ports:
      - "5760:5760"    # MAVLink TCP port
      - "14550:14550"  # QGroundControl port
      - "14540:14540"  # Offboard API
      - "18570:18570"  # Simulator
    volumes:
      - ./PX4-Autopilot:/workspace/PX4-Autopilot
      - ./src:/workspace/src
      - ./logs:/workspace/logs
      - ./data:/workspace/data
    environment:
      - PX4_HOME_LAT=42.3898
      - PX4_HOME_LON=-71.1476
      - PX4_HOME_ALT=14.2
      - DISPLAY=${DISPLAY}
    network_mode: host
    working_dir: /workspace
    command: sitl
    stdin_open: true
    tty: true

